name: AMLGuard ML Pipeline

on:
  push:
    branches: [main]
  schedule:
    # Weekly retrain — Sunday at midnight UTC. Adjust to your needs.
    - cron: '0 0 * * 0'
  workflow_dispatch: {}  # allows manual triggering from the Actions tab

jobs:
  validate-train-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Generate synthetic data
        run: python src/generate_synthetic_data.py

      - name: Validate data
        run: python src/validate_data.py

      - name: Train model
        run: python src/train.py

      - name: Evaluate against production baseline
        run: python src/evaluate.py

      - name: Register model in MLflow
        if: success()
        run: python src/log_to_registry.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Upload model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amlguard-model
          path: artifacts/

      - name: Pipeline failed — model not promoted
        if: failure()
        run: |
          echo "One or more pipeline stages failed."
          echo "Production model has NOT been replaced."
          exit 1

